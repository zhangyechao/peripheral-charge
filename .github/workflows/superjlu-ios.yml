# Publish this file as .github/workflows/superjlu-ios.yml.
# Publish the source ZIP as superjlu-ios/project.zip on the same branch.
name: Build SuperJLU iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: ['codex/superjlu-ios-build']
    paths:
      - 'superjlu-ios/project.zip'
      - '.github/workflows/superjlu-ios.yml'

permissions:
  contents: read

concurrency:
  group: superjlu-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP_ROOT: ${{ github.workspace }}/superjlu-ios/source/SuperJLU-iPhone
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Extract app source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('superjlu-ios/source').resolve()
          with zipfile.ZipFile('superjlu-ios/project.zip') as archive:
              for entry in archive.infolist():
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit('Unsafe archive path')
                  if entry.is_dir():
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
          PY
      - name: Check Xcode
        run: xcodebuild -version
      - name: Run backend tests
        shell: bash
        run: |
          cd "$APP_ROOT"
          python -m pip install --target .tools/testdeps cryptography==50.0.2 Pillow==13.0.0
          python tools/test_port.py
      - name: Compile iPhone app and package unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_ROOT"
          mkdir -p build
          python tools/build_unsigned_ipa.py 2>&1 | tee build/xcodebuild.log
      - name: Upload IPA and build report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SuperJLU-iPhone-unsigned
          path: |
            ${{ env.APP_ROOT }}/build/SuperJLU-1.3.4-iOS-unsigned.ipa
            ${{ env.APP_ROOT }}/build/build-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SuperJLU-iPhone-build-log
          path: ${{ env.APP_ROOT }}/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
